# Display (nice_oled module)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=5000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3000000

# Bluetooth
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Mouse keys (&mkp / &mmv / &msc / &turbo)
CONFIG_ZMK_POINTING=y

# ZMK Studio and peripheral battery fetching are enabled for the left (central)
# half only, via cmake-args in build.yaml.
